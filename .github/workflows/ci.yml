# CI: a ogni pull request gioca tutte le partite possibili nel browser e
# verifica che il computer sia imbattibile. Dopo il merge su main il test
# viene rieseguito dal workflow di deploy, prima di pubblicare.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test imbattibilità
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa il browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Gioca tutte le partite
        run: npm test
